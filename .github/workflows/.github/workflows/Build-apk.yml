name: Build OLI Mobile APK

on:
  workflow_dispatch:

  push:
    paths:
      - 'Android/OLI-Mobile/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Android/OLI-Mobile

    steps:
      - name: Checkout OLI
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper \
              --gradle-version 8.11.1 \
              --distribution-type bin
          fi

          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OLI-Mobile-1.6.1-debug
          path: Android/OLI-Mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Release APK
        run: |
          ./gradlew --no-daemon assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OLI-Mobile-1.6.1-release
          path: Android/OLI-Mobile/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
