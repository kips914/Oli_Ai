- Assistant messages are now rendered with a mobile-friendly copy-first design.
- Markdown fenced code blocks are shown as dedicated code cards.
- Every code card has a **Копировать** button.
- The whole assistant response has a **Скопировать всё** button.
- Common command lines (`git`, `dotnet`, `python`, `curl`, PowerShell, URLs, etc.) receive a compact one-tap copy button.
- Normal chat text remains selectable so the user can long-press and copy any part manually.
- HTML escaping prevents model text from being interpreted as markup.

## Android
- The Android APK project continues to use the same mobile gateway UI inside WebView, so the new copy-friendly chat design is available in the native app too.

## Tailscale / QR
- Existing OLI Mobile QR pairing and Tailscale flow are preserved.

# Подключение к OLI с телефона через Tailscale

Позволяет открыть чат с вашим ПК с телефона из любой сети — мобильного
интернета, кафе, работы с ограничительным Wi-Fi — без проброса портов и без
статического публичного IP. Tailscale создаёт приватную зашифрованную сеть
(поверх WireGuard) между вашими устройствами; порт шлюза (8765) никогда не
торчит в открытый интернет — достучаться до него могут только устройства в
вашем tailnet.

## 1. На ПК

1. Установите Tailscale: https://tailscale.com/download/windows
2. Войдите под своим аккаунтом (Google/Microsoft/GitHub — любой).
3. Соберите и запустите шлюз:
   ```powershell
   powershell -ExecutionPolicy Bypass -File .\scripts\build-mobile-gateway.ps1
   powershell -ExecutionPolicy Bypass -File .\scripts\start-mobile-gateway.ps1
   ```
4. Узнайте свой Tailscale-адрес:
   ```powershell
   tailscale ip -4
   ```
   Будет что-то вроде `100.101.102.103`.

Чтобы шлюз поднимался автоматически при входе в Windows, добавьте ярлык на
`scripts\start-mobile-gateway.ps1` в папку автозагрузки (в Проводнике введите
`shell:startup` в адресную строку и положите туда ярлык).

## 2. На телефоне

1. Установите Tailscale (App Store / Google Play), войдите тем же аккаунтом.
2. Установите OLI как приложение:
   - Откройте в браузере `http://100.101.102.103:8765` (ваш адрес из шага 1.4).
   - iOS Safari: «Поделиться» → «На экран «Домой»».
   - Android Chrome: меню (⋮) → «Установить приложение» / «Добавить на главный экран».
3. Откройте установленное приложение OLI, впишите тот же адрес, нажмите «Подключиться».
4. Готово — работает из любой сети, где есть интернет у телефона, включая мобильную передачу данных.

## Почему это работает даже в «белых списках» и на мобильном интернете

Tailscale не открывает входящий порт на роутере — устройства сами находят
друг друга и устанавливают исходящее шифрованное соединение (WireGuard), а
если прямое соединение невозможно (двойной NAT, строгий фаервол оператора),
трафик проходит через relay-серверы Tailscale (DERP) — тоже только исходящие
соединения. Это тот же принцип, на котором работают многие корпоративные VPN,
поэтому обычно проходит даже там, где обычный «домашний» проброс портов
заблокирован политикой оператора или Wi-Fi-сети.

## Без Tailscale (только домашняя Wi-Fi)

Если телефон и ПК в одной Wi-Fi сети, Tailscale не обязателен — используйте
локальный IP ПК (`ipconfig` → IPv4-адрес, обычно `192.168.x.x`) вместо
Tailscale-адреса. Как только телефон покидает эту сеть (мобильный интернет,
другая точка доступа), соединение перестанет работать — для этого и нужен
Tailscale.

## Безопаснее (опционально): HTTPS через Tailscale

Tailscale умеет выпускать настоящий TLS-сертификат для вашего устройства:
```powershell
tailscale cert your-pc-name.your-tailnet.ts.net
```
Подключить готовый сертификат к Kestrel (ASP.NET) — отдельная настройка в
`OLI.MobileGateway/Program.cs` (`UseKestrel().ConfigureHttpsDefaults(...)`);
по умолчанию шлюз работает по HTTP, но трафик всё равно зашифрован на уровне
самого Tailscale (WireGuard), так что это не «открытый» HTTP в привычном
смысле — этот шаг нужен только для дополнительного слоя защиты.

