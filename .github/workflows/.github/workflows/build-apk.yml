# OLI 1.3.4 — GitHub Releases setup

The application checks the latest **non-prerelease** GitHub Release through the GitHub Releases API.

## 1. Set the repository URL

Open OLI → Settings → Updates and enter:

`https://github.com/YOUR_USERNAME/YOUR_REPOSITORY`

The value is saved to the normal OLI settings file under `%LOCALAPPDATA%\OLI\settings.json`.

## 2. Publish releases

Create GitHub Releases with semantic version tags such as:

- `v1.3.4`
- `v1.3.4`
- `v1.4.0`

The checker ignores prereleases and compares the numeric version against the application version.

## 3. Updating files

The checker intentionally does **not** replace OLI.exe by itself. When an update is available it opens the GitHub release page. The existing OLI GUI installer/updater remains responsible for replacing application files while preserving user data and models.

## 4. Recommended release asset

For each public release, upload the built release ZIP containing the GUI installer/update package. The update checker does not depend on a fixed asset filename, so the release can also contain documentation or checksums.

# OLI 1.3.2 icon integration

## Main application
- Source: `OLI.Client/Assets/OLI.ico`
- Embedded by `OLI.Client.csproj` using `ApplicationIcon`.
- The published `dist/OLI.exe` will use the OLI main icon.

## Installer
- Source: `installer/OLI_Setup.ico`
- Intended for the compiled `OLI_Setup.exe` resource.
- `Install-OLI.ps1` reports the icon path for packaging.

The icons are multi-resolution ICO files (16..256 px).

param(
    [switch]$Update,
    [ValidateSet('auto','ru','en')]
    [string]$Language = 'auto'
)
$ErrorActionPreference = "Stop"
$root = $PSScriptRoot
$scripts = Join-Path $root "scripts"
$installerIcon = Join-Path $root "installer\OLI_Setup.ico"

function Resolve-Language([string]$value) {
    if ($value -eq 'ru') { return 'ru' }
    if ($value -eq 'en') { return 'en' }
    $culture = [System.Globalization.CultureInfo]::CurrentUICulture.TwoLetterISOLanguageName
    return $(if ($culture -eq 'en') { 'en' } else { 'ru' })
}
$Language = Resolve-Language $Language

$Strings = @{
    ru = @{
        Start='Запуск установки OLI...'; Icon='Иконка установщика'; DotNetMissing='Не удалось автоматически установить .NET 8 SDK.'; Winget='Устанавливаю .NET 8 SDK через winget...'; DotNetScript='Устанавливаю .NET 8 SDK через официальный скрипт...'; LlamaFail='Установка llama.cpp завершилась с ошибкой.'; BuildFail='Сборка OLI.exe завершилась с ошибкой.'; LauncherMissing='OLI-Launcher.exe не найден.'; Done='Установка OLI завершена.'
    }
    en = @{
        Start='Starting OLI installation...'; Icon='Installer icon'; DotNetMissing='Could not install the .NET 8 SDK automatically.'; Winget='Installing the .NET 8 SDK via winget...'; DotNetScript='Installing the .NET 8 SDK using the official script...'; LlamaFail='llama.cpp installation failed.'; BuildFail='OLI.exe build failed.'; LauncherMissing='OLI-Launcher.exe is missing.'; Done='OLI installation complete.'
    }
}
function T([string]$key) { return $Strings[$Language][$key] }

function Test-DotNet8Sdk {
    if (!(Get-Command dotnet -ErrorAction SilentlyContinue)) { return $false }
    $sdks = & dotnet --list-sdks 2>$null
    return ($null -ne ($sdks | Where-Object { $_ -match "^8\." }))
}

Write-Host (T 'Start')
if (Test-Path $installerIcon) { Write-Host "$(T 'Icon'): $installerIcon" }

if (-not $Update) {
    if (!(Test-DotNet8Sdk)) {
        $winget = Get-Command winget -ErrorAction SilentlyContinue
        $customInstallDir = $null
        if ($winget) {
            Write-Host (T 'Winget')
            winget install --id Microsoft.DotNet.SDK.8 -e --accept-package-agreements --accept-source-agreements
        } else {
            Write-Host (T 'DotNetScript')
            $installerScript = Join-Path $env:TEMP "dotnet-install.ps1"
            Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile $installerScript -UseBasicParsing
            $customInstallDir = Join-Path $env:LOCALAPPDATA "Microsoft\dotnet"
            & $installerScript -Channel 8.0 -InstallDir $customInstallDir
        }
        # Rebuild PATH from the registry (picks up a winget-installed SDK, which
        # registers itself there) and, if dotnet-install.ps1 was used instead,
        # re-add its custom install dir explicitly — a plain registry refresh
        # here would otherwise silently drop it, since dotnet-install.ps1 with a
        # custom -InstallDir does not register itself in the registry PATH.
        $env:PATH = [Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + [Environment]::GetEnvironmentVariable("PATH", "User")
        if ($customInstallDir) { $env:PATH = "$customInstallDir;$env:PATH" }
        if (!(Test-DotNet8Sdk)) { throw (T 'DotNetMissing') }
    }

    & (Join-Path $scripts "install-oli.ps1") -Language $Language
    if ($LASTEXITCODE -ne 0) { throw (T 'LlamaFail') }
}

& (Join-Path $scripts "build-oli.ps1") -Language $Language
if ($LASTEXITCODE -ne 0) { throw (T 'BuildFail') }

$launcher = Join-Path $root "OLI-Launcher.exe"
if (!(Test-Path $launcher)) { throw (T 'LauncherMissing') }

$shell = New-Object -ComObject WScript.Shell
$desktop = [Environment]::GetFolderPath("Desktop")
$startMenu = Join-Path ([Environment]::GetFolderPath("Programs")) "OLI"
New-Item -ItemType Directory -Force -Path $startMenu | Out-Null

foreach ($dir in @($desktop, $startMenu)) {
    $lnk = $shell.CreateShortcut((Join-Path $dir "OLI.lnk"))
    $lnk.TargetPath = $launcher
    $lnk.WorkingDirectory = $root
    $exe = Join-Path $root "dist\OLI.exe"
    if (Test-Path $exe) { $lnk.IconLocation = "$exe,0" }
    $lnk.Description = if ($Language -eq 'en') { 'OLI - local AI assistant' } else { 'OLI — локальный ИИ-помощник' }
    $lnk.Save()
}

Write-Host (T 'Done')

# OLI language support

OLI v1.3.4 supports Russian and English UI languages.

## Application

Open **Settings → Language** and select:

- Automatic (system)
- Русский
- English

The selected value is saved in the normal OLI settings file. `Auto` resolves from the Windows UI culture.

## Installer

`Install-OLI.ps1` accepts:

```text
-Language auto
-Language ru
-Language en
```

The default is `auto`.

# OLI 1.5.1 — Mobile control

The mobile PWA is a remote control surface for the OLI PC engine.

## Remote settings
After pairing, the phone can read/write:
- generation mode
- context size
- CPU threads
- GPU layers
- temperature
- Web Search enabled/disabled
- search result count
- maximum pages opened per search request

Changes are written to `%LOCALAPPDATA%\OLI\settings.json` on the PC.
Engine-related changes require the remote "Restart AI" action.

## Tailscale
Use the PC's Tailscale IPv4 address and port 8765. The mobile gateway is the
only service intended to be reachable remotely; `llama-server` stays bound
to `127.0.0.1:8080`.

Do not expose port 8765 directly to the public Internet. Pairing is an
application-level token, while Tailscale provides the private network path.

# OLI model sources — 1.4.9 (Qwen2.5-7B default, RF-friendly)

Default model: **Qwen2.5-7B-Instruct Q4_K_M GGUF** (~4.7 GB).

OLI downloads a local GGUF first, validates the GGUF magic/header, then starts llama-server with `-m`.

| Priority | Source | Notes |
|---|---|---|
| 1 | modelscope.cn | Primary for RF/CN — Hugging Face often blocked in RF. |
| 2 | hf-mirror.com | Mirror; usually reachable even where huggingface.co isn't. |
| 3 | huggingface.co | Official source, tried last — costs nothing to attempt since it's only reached if both of the above fail. |

If a valid `.gguf` already exists in `models\`, OLI uses it and does not download another model.

Large downloads use HTTP Range resume and are retried.

## Manual download (recommended if auto-download fails)

Save as:
`models\qwen2.5-7b-instruct-q4_k_m.gguf` (~4.68 GB)

- ModelScope: open https://modelscope.cn/models/Qwen/Qwen2.5-7B-Instruct-GGUF/files and download `qwen2.5-7b-instruct-q4_k_m.gguf` (merged, ~4.68 GB), or use the API URL:
  `https://www.modelscope.cn/api/v1/models/Qwen/Qwen2.5-7B-Instruct-GGUF/repo?Revision=345e09e89622732311e732c2e94c063d2b9c8a10&FilePath=qwen2.5-7b-instruct-q4_k_m.gguf`

A 6 GB GPU can run this with limited headroom — close other GPU apps and consider lowering `--ctx-size` (e.g. 2048) in Settings if you see OOM in `llama-server.error.log`.

