# OLI 1.3.1_released

## Implemented
- Fast / Performance generation modes.
- Persistent user profile memory: name, age, interests, skills, projects.
- Date/time injected into the system environment at request time.
- Settings GUI: themes, mode, context/threads/GPU-layer profiles, cache reset, engine restart, diagnostics, full user-data reset.
- Persistent settings in `data/settings.json`.
- Mobile architecture skeleton: `OLI.MobileGateway` + `Mobile/README.md`.

## Mobile security baseline
The gateway is localhost-only by default. Do not port-forward it. Internet access will be implemented through an authenticated TLS relay in a later version.

## Memory separation
User profile/memory is kept outside model weights. This follows the OLI architecture principle: mutable memory and context must not be confused with training/fine-tuning.

# OLI 1.5.0 — Mobile PWA client

New: a phone client for OLI. Scoped honestly as a **Progressive Web App**
(installable from the browser, works on iOS and Android, no app store) —
not a native app. This is what could actually be built, reviewed, and
delivered without a mobile toolchain or a real device to test on; a native
app is a much larger, separate effort with per-platform code this session
didn't attempt.

## What it does
- **Runs the model from the phone.** `OLI.MobileGateway` gained
  `/api/ensure-running`: if llama-server isn't up, it launches
  `OLI-Launcher.exe` on the PC — reusing all of its existing bootstrap logic
  (installing llama.cpp, downloading the model via its multi-source
  fallback, reading `settings.json`) instead of duplicating any of it.
  `/api/engine-status` lets the phone poll while it boots.
- **Works from anywhere, including behind restrictive networks, via
  Tailscale.** The gateway now binds `0.0.0.0:8765` instead of
  `127.0.0.1` — reachable over a Tailscale tailnet from mobile data, a
  work Wi-Fi with outbound restrictions, wherever. This is safe because
  Tailscale's tailnet is itself an authenticated, encrypted WireGuard
  overlay: nothing outside it can route to the machine's Tailscale address
  no matter what the app binds to, and device pairing (the existing token
  system) is a second, independent layer on top. Full walkthrough in the
  new `TAILSCALE_SETUP.md`.
- **A real mobile UI**, not just a page — pairing screen, chat with the
  same dark palette as the desktop app, a banner + one-tap button when the
  engine isn't running, settings sheet, installable to the home screen
  (`manifest.json`, service worker for the app shell).
- **Photo OCR at any angle.** Camera capture → OCR runs **client-side** in
  the phone's browser via Tesseract.js, so no new native dependency on the
  PC. The photo is tried at 0°/90°/180°/270° and whichever rotation gives
  the highest-confidence result is kept — handles the common
  sideways/upside-down phone-photo case. Recognized text can be dropped
  straight into the chat. Honest limitation: this does not deskew small
  arbitrary tilt angles (e.g. a 15° lean), only 90°-increment rotation.

## New files
- `OLI.MobileGateway/wwwroot/` — the PWA itself (`index.html`, `style.css`,
  `app.js`, `service-worker.js`, `manifest.json`, icons).
- `scripts/build-mobile-gateway.ps1` — publishes a self-contained
  `OLI.MobileGateway.exe` (the desktop `build-oli.ps1` only ever built the
  WPF client, never this).
- `scripts/start-mobile-gateway.ps1` — runs it in the background, checks
  for an already-running instance first, prints the Windows Startup-folder
  instructions for auto-start.
- `TAILSCALE_SETUP.md` — end-to-end setup guide.

## Not in this pass
Listed plainly in `Mobile/README.md` rather than silently left out:
streaming (token-by-token) responses, true offline chat, a system tray icon
for the gateway (it's a plain background process for now), and — again —
a native Android/iOS app.

## Verification status
None of this has been run on an actual phone, network, or Windows machine —
this environment has no mobile device, no Tailscale, and no .NET/ASP.NET
runtime to test against. JS syntax was checked with `node -c`, JSON/HTML
were checked structurally, and element IDs were cross-referenced between
`app.js` and `index.html`, but the real test is building
`OLI.MobileGateway`, pairing a phone, and trying it for real.

# OLI 1.5.1 — Mobile + Remote Settings

## Mobile
- Mobile PWA can read and change the same OLI settings used on PC.
- Added remote engine restart after changing engine settings.
- Pairing token is required for settings/chat/engine actions.
- Tailscale remains the recommended transport for remote access; OLI does not expose llama-server itself.

## OCR
- Mobile OCR now tests eight orientations (45° increments) to improve recognition of rotated photos.
- OCR remains client-side; no photo is uploaded to the PC for OCR.

## Web Search
- Increased default search results from 5 to 12.
- Increased maximum pages per request to 6.
- Added configurable page/context budgets.
- Expanded the curated allow-list with developer documentation, news and technology sources.
- Search results are de-duplicated by URL.

## Desktop settings
- Added Web Search result/page controls to Settings.
- Existing model, memory, conversations and user data remain outside the release archive and are not deleted by updates.

## Upgrade
Replace program components from this release, but keep the existing `models` and `%LOCALAPPDATA%\OLI` data.

# OLI Mobile 1.6.1

- Added native Android project under `Android/OLI-Mobile`.
- Added QR setup flow for Tailscale authorization links.
- Added QR setup flow for OLI gateway URLs.
