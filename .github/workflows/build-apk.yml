name: Build OLI Mobile APK

on:
  # Called by build-apk-tag.yml for release tags (path filters don't apply to tags).
  workflow_call:
    inputs:
      default_server:
        type: string
        required: false
        default: ''
  push:
    branches: [main, 'arena/**']
    paths:
      - 'Android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'Android/**'
  workflow_dispatch:
    inputs:
      default_server:
        description: 'Адрес сервера по умолчанию (например 192.168.1.10:8765), можно оставить пустым'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest image ships the Android SDK; just make it visible and add
      # the platform/build-tools the app compiles against.
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SDKM/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null || true
          fi
          printf 'sdk.dir=%s\n' "$SDK" > Android/OLI-Mobile/local.properties
          ls "$SDK/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug + release APK
        env:
          OLI_DEFAULT_SERVER: ${{ github.event.inputs.default_server }}
        run: bash Android/ci/gradle-build.sh

      - name: Collect artifacts
        run: |
          mkdir -p dist
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' Android/OLI-Mobile/app/build.gradle.kts | head -1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp Android/OLI-Mobile/app/build/outputs/apk/debug/app-debug.apk "dist/OLI-Mobile-${VERSION}-debug.apk"
          find Android/OLI-Mobile/app/build/outputs/apk/release -name '*.apk' -exec cp {} "dist/OLI-Mobile-${VERSION}-release.apk" \;
          ls -lh dist

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: Android/*.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OLI-Mobile-${{ env.VERSION }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach to release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" > /dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --title "OLI ${{ github.ref_name }}" --notes "OLI release ${{ github.ref_name }}"
          gh release upload "${{ github.ref_name }}" dist/*.apk --clobber
