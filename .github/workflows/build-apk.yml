name: Build OLI Mobile APK

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'Android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'Android/**'
  workflow_dispatch:
    inputs:
      default_server:
        description: 'Адрес сервера по умолчанию (например 192.168.1.10:8765), можно оставить пустым'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug + release APK
        working-directory: Android/OLI-Mobile
        run: |
          gradle --no-daemon assembleDebug
          gradle --no-daemon assembleRelease -POLI_DEFAULT_SERVER="${{ github.event.inputs.default_server }}"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' Android/OLI-Mobile/app/build.gradle.kts | head -1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp Android/OLI-Mobile/app/build/outputs/apk/debug/app-debug.apk "dist/OLI-Mobile-${VERSION}-debug.apk"
          find Android/OLI-Mobile/app/build/outputs/apk/release -name '*.apk' -exec cp {} "dist/OLI-Mobile-${VERSION}-release.apk" \;
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OLI-Mobile-${{ env.VERSION }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach to release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" > /dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --title "OLI ${{ github.ref_name }}" --notes "OLI release ${{ github.ref_name }}"
          gh release upload "${{ github.ref_name }}" dist/*.apk --clobber
